name: TimeControl
options:
  bundleIdPrefix: com.ethanchiou
  # Config/Supabase.xcconfig is gitignored; a fresh clone still generates and builds without it.
  disabledValidations: [missingConfigFiles]
  xcodeVersion: "26.3"
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  TimeControlCore:
    path: Packages/TimeControlCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TimeControl:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: TimeControl
    dependencies:
      - package: TimeControlCore
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Supabase.xcconfig
      Release: Config/Supabase.xcconfig
    info:
      path: TimeControl/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_PUBLISHABLE_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.ethanchiou.TimeControl
            CFBundleURLSchemes: [timecontrol]
    entitlements:
      path: TimeControl/Resources/TimeControl.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanchiou.TimeControl
        PRODUCT_NAME: TimeControl
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "TimeControl mirrors your courses and events into a dedicated Apple Calendar so reminders reach every device."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/Frameworks"
  TimeControlTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: TimeControlTests
    dependencies:
      - target: TimeControl
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanchiou.TimeControlTests
        CODE_SIGN_IDENTITY: "-"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/TimeControl.app/Contents/MacOS/TimeControl"
        "TEST_HOST[sdk=iphoneos*]": "$(BUILT_PRODUCTS_DIR)/TimeControl.app/TimeControl"
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/TimeControl.app/TimeControl"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TimeControl:
    build:
      targets:
        TimeControl: all
        TimeControlTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [TimeControlTests]
