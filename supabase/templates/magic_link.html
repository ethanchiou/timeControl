<h2>Sign in to TimeControl</h2>
<p>Enter this code in TimeControl:</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 4px; font-family: ui-monospace, Menlo, monospace;">{{ .Token }}</p>
<p>Or open this link on the device you are signing in from:</p>
<p><a href="{{ .ConfirmationURL }}">Sign in to TimeControl</a></p>
<p>The code and the link both expire in 10 minutes and can be used once. If you did not ask for them, you can ignore this email.</p>
